appId: com.kentecorner.app
productName: "Kente's Korner"
artifactName: "kentecorner-setup-${version}.${ext}"

# Source root is the repo root
directories:
  output: dist

# ── Files included in the app bundle ────────────────────────────────────────
# Only the runtime-needed web/JS files are packaged.
# roms/, bios/, saves/ live in %APPDATA%/KenteCorner/ at runtime (created by server).
# The server and Windows emulator runtimes arrive via extraResources below.
# Build the server with PyInstaller on the target OS before packaging.
files:
  - "electron/**"
  - "resources/KenteCorner.ico"
  - "!batocera/**"
  - "!build/**"
  - "!.tmp-*/**"
  - "!tmp_*/**"
  - "!tests/**"
  - "!.github/**"
  - "!deploy/**"
  - "!scripts/**"
  - "!README.md"
  - "!Screenshot *.png"
  - "!bios/**"
  - "!roms/**"
  - "!dist/**"
  - "!resources/dolphin/**"
  - "!resources/kente-server"
  - "!resources/kente-server.exe"
  - "!resources/emulators/**"
  - "!resources/runtime-dlls/**"

# ── Extra resources bundled outside the asar archive ────────────────────────
# Placed in <install>/resources/ and accessed via process.resourcesPath.
# Web assets (index.html, js/, …) are kept outside the asar so the
# bundled Python server can read them off disk via WEB_DIR. The Electron
# main process passes KENTE_WEB_DIR=<install>/resources/web to the server.
extraResources:
  - from: "resources/emulators"
    to: "emulators"
    filter:
      - "**/*"
  - from: "resources/runtime-dlls"
    to: "runtime-dlls"
    filter:
      - "**/*"
  - from: "index.html"
    to: "web/index.html"
  - from: "js"
    to: "web/js"
    filter: ["**/*"]
  - from: "vendor"
    to: "web/vendor"
    filter: ["**/*"]
  - from: "library.js"
    to: "web/library.js"
  - from: "style.css"
    to: "web/style.css"
  - from: "boxart"
    to: "web/boxart"
    filter: ["**/*"]
  - from: "Conceptual Artifacts"
    to: "web/Conceptual Artifacts"
    filter: ["**/*"]
  - from: "games"
    to: "web/games"
    filter: ["**/*"]
  - from: "mods"
    to: "web/mods"
    filter: ["**/*"]
  # Optional offline EmulatorJS pack (generated by /api/ejs/prefetch or fetch script).
  - from: "cache/ejs-stable"
    to: "web/cache/ejs-stable"
    filter: ["**/*"]

# ── Windows ──────────────────────────────────────────────────────────────────
win:
  target:
    - target: nsis
      arch:   [x64]
  icon: "resources/KenteCorner.ico"
  requestedExecutionLevel: asInvoker
  extraResources:
    - from: "resources/kente-server.exe"
      to: "kente-server.exe"

nsis:
  oneClick:                        false
  allowToChangeInstallationDirectory: true
  installerIcon:                   "resources/KenteCorner.ico"
  uninstallerIcon:                 "resources/KenteCorner.ico"
  installerHeaderIcon:             "resources/KenteCorner.ico"
  createDesktopShortcut:           always
  createStartMenuShortcut:         true
  shortcutName:                    "Kente's Korner"

mac:
  target:
    - target: dmg
    - target: zip
  icon: "Conceptual Artifacts/KenteCorner Logo.png"
  category: public.app-category.games
  extraResources:
    - from: "resources/kente-server"
      to: "kente-server"
  # Signing/notarization require the publisher's Apple Developer credentials.
  identity: null

dmg:
  sign: false

publish:
  provider: github
  owner:    n-13thehat
  repo:     KentesKorner
