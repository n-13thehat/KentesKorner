name: macOS in-app player build

on:
  pull_request:
    paths:
      - '.github/workflows/mac-native-player-check.yml'
      - '.github/workflows/macos-package.yml'
      - 'electron/**'
      - 'js/**'
      - 'index.html'
      - 'style.css'
      - 'batocera/**'
      - 'resources/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'electron-builder.yml'
  push:
    branches: ['**']
    paths:
      - '.github/workflows/mac-native-player-check.yml'
      - '.github/workflows/macos-package.yml'
      - 'electron/**'
      - 'js/**'
      - 'index.html'
      - 'style.css'
      - 'batocera/**'
      - 'resources/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'electron-builder.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: x64
            artifact_dir: mac
          - runner: macos-15
            arch: arm64
            artifact_dir: mac-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install packaging tools
        run: python -m pip install pyinstaller
      - name: Install native build tools
        run: brew install cmake ninja nasm
      - name: Cache PCEE2 build dependencies
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/kente-pcee2-dependencies
          key: kente-pcee2-${{ matrix.arch }}-${{ hashFiles('scripts/pcee2-mac-revision.txt', 'scripts/fetch-mac-pcee2.mjs') }}
      - name: Prepare resource folders
        run: mkdir -p resources/emulators resources/runtime-dlls cache/ejs-stable cache/ejs-cores
      - run: npm ci
      - name: Check application syntax
        run: npm run check:syntax
      - name: Build macOS installer
        run: npm run build:mac -- --${{ matrix.arch }} --publish never
        env:
          KENTE_PCEE2_DEPS_DIR: ${{ runner.temp }}/kente-pcee2-dependencies/${{ matrix.arch }}/prefix
          KENTE_PCEE2_DEPS_WORKDIR: ${{ runner.temp }}/kente-pcee2-dependencies/${{ matrix.arch }}/work
      - name: Verify packaged native player
        run: node scripts/verify-mac-native-package.mjs ${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: kentecorner-macos-player-${{ matrix.arch }}
          path: |
            dist/${{ matrix.artifact_dir }}/*.dmg
            dist/${{ matrix.artifact_dir }}/*.zip
          if-no-files-found: error
          retention-days: 14
